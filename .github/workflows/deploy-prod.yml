# .github/workflows/deploy-prod.yml
#
# Deploys to production (guide.amalfi.day) when a GitHub Release is published.
# Uses `vercel deploy --prod` to promote to production domain.
#
# Trigger: GitHub Release published
# Deployment URL: guide.amalfi.day

name: Deploy Production

on:
  release:
    types:
      - published

concurrency:
  group: prod-release
  cancel-in-progress: false

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

  deploy:
    name: Deploy to Production
    needs: lint
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://guide.amalfi.day
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Vercel CLI
        run: npm i -g vercel

      - name: Pull Vercel environment
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Build project
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          NEXT_PUBLIC_DEPLOY_ENV: production

      - name: Deploy to Production
        id: deploy
        run: |
          DEPLOY_URL=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$DEPLOY_URL" >> "$GITHUB_OUTPUT"
          echo "### :ship: Production Deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "**Release:** \`${{ github.event.release.tag_name }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "**URL:** https://guide.amalfi.day" >> "$GITHUB_STEP_SUMMARY"
          echo "**Deploy URL:** $DEPLOY_URL" >> "$GITHUB_STEP_SUMMARY"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
